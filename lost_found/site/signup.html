<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>Lost & Found — Создать аккаунт</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page page--auth">
  <header class="header header--compact">
    <div class="container header__inner">
      <a class="brand" href="index.html" aria-label="Lost & Found — на главную">
        <img class="brand__logo" src="assets/logo.svg" width="60" height="60" alt="">
        <span class="brand__name">Lost &amp; Found</span>
      </a>
    </div>
  </header>

  <main>
    <div class="container container--narrow">
      <div class="auth-head">
        <h1 class="auth-head__title">Создать аккаунт</h1>
        <p class="auth-head__subtitle">Вступайте в L&amp;F - помогайте возвращать вещи</p>
      </div>

      <form class="auth-card" id="signup-form" novalidate>
        <div class="field">
          <label class="field__label field__label--grey" for="signup-name">Полное имя</label>
          <input class="input" type="text" id="signup-name" name="name" placeholder="Введите полное имя" autocomplete="name" required>
        </div>
        <div class="field">
          <label class="field__label field__label--grey" for="signup-email">Электронная почта</label>
          <input class="input" type="email" id="signup-email" name="email" placeholder="Введите email" autocomplete="email" required>
        </div>
        <div class="field">
          <label class="field__label field__label--grey" for="signup-password">Пароль</label>
          <div class="pass-field">
            <input class="input" type="password" id="signup-password" name="password" placeholder="Придумайте пароль" autocomplete="new-password" required>
            <button class="pass-field__eye" type="button" data-eye="signup-password" aria-label="Показать пароль">
              <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M1.8 10S4.8 4.5 10 4.5 18.2 10 18.2 10 15.2 15.5 10 15.5 1.8 10 1.8 10z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/></svg>
            </button>
          </div>
          <p class="field__hint">Не менее 8 символов</p>
        </div>
        <div class="field">
          <label class="field__label field__label--grey" for="signup-password2">Подтвердите пароль</label>
          <div class="pass-field">
            <input class="input" type="password" id="signup-password2" name="password2" placeholder="Повторите пароль" autocomplete="new-password" required>
            <button class="pass-field__eye" type="button" data-eye="signup-password2" aria-label="Показать пароль">
              <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M1.8 10S4.8 4.5 10 4.5 18.2 10 18.2 10 15.2 15.5 10 15.5 1.8 10 1.8 10z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <label class="check">
          <input class="check__box" type="checkbox" name="terms" required>
          <span>Я принимаю <a class="check__link" href="#">условия использования</a>
          и <a class="check__link" href="#">политику конфиденциальности</a></span>
        </label>
        <button class="btn btn--primary btn--block" type="submit">Создать аккаунт</button>
        <p class="auth-card__divider">Или зарегистрируйтесь через</p>
        <button class="auth-card__social" type="button">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41.4 35.4 44 30.2 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
          Google
        </button>
      </form>

      <p class="auth-foot">Уже есть аккаунт? <a class="check__link" href="login.html">Войти</a></p>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
